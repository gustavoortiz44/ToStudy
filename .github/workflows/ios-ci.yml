name: iOS CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ feat/* ]

jobs:
  build:
    runs-on: macos-13

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS deps
        run: npm ci

      - name: Install Bundler
        run: gem install bundler

      - name: Install CocoaPods
        working-directory: ios
        run: |
          bundle init || true
          bundle add cocoapods --version "~> 1.13" || true
          bundle exec pod install

      - name: Build iOS (Dev Debug - simulator)
        working-directory: ios
        run: |
          xcodebuild -workspace ToStudy.xcworkspace \
            -scheme "ToStudy-Dev" -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            build | xcpretty
